[package]
name = "retain"
version = "0.1.0-pre"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]


[dependencies]
clack-plugin = { path = "../clack/plugin" }
clack-extensions = { path = "../clack/extensions", features = [
    "audio-ports",
    "clack-plugin",
    "gui",
    "note-ports",
    "params",
    "raw-window-handle_05",
    "state",
	"latency",
] }
egui-baseview = { git = "https://codeberg.org/RustAudio/egui-baseview.git", version = "0.2.7" }

# for calculation
realfft = { version = "3.5.0", features = ["avx", "neon", "sse"] }
num-complex = "0.4.6"
rustc-hash = "2.1.2"
atomic_float = "1.1.0"

# for saving the state
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
egui = "0.34.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
